<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자율학습 저녁 식사 통계</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- 엑셀 파일 처리 및 스타일링을 위한 xlsx-js-style 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <!-- PDF 파일 처리를 위한 PDF.js 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-50 p-4 md:p-8 font-sans">

    <!-- Toast 알림창 -->
    <div id="toast" class="fixed top-4 right-4 bg-gray-800 text-white px-6 py-3 rounded shadow-lg transform -translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center pointer-events-none">
        <i class="fas fa-info-circle mr-2"></i>
        <span id="toastMessage">메시지</span>
    </div>

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-utensils text-blue-500 mr-2"></i>배정고 1학년 자율학습 식사 체크</h1>
                <p class="text-gray-500 mt-1">당번 선생님 저녁 식사 여부 및 통계 대시보드 (클라우드 동기화 🟢)</p>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
                <div class="relative group">
                    <input type="file" id="fileInput" accept=".xlsx, .xls, .csv, .pdf" class="hidden" onchange="handleFileUpload(event)">
                    <label for="fileInput" class="px-4 py-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition duration-200 text-sm font-medium border border-blue-200 cursor-pointer inline-flex items-center shadow-sm">
                        <i class="fas fa-file-upload mr-1"></i> 새 명단 업로드
                    </label>
                    <!-- 업로드 안내 툴팁 -->
                    <div class="absolute right-0 top-full mt-2 w-72 bg-gray-800 text-white text-xs rounded p-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-10">
                        CSV 및 엑셀 명단 파일을 올려주세요. 모든 접속자에게 즉시 반영됩니다.
                    </div>
                </div>
                <button onclick="resetData()" class="px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition duration-200 text-sm font-medium border border-red-200 shadow-sm">
                    <i class="fas fa-rotate-right mr-1"></i> 체크 초기화
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Column: Schedule & Checklist -->
            <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-5 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                    <h2 id="checklistTitle" class="text-lg font-bold text-gray-700">📅 대기 중</h2>
                    <span class="text-xs text-gray-500 bg-white px-2 py-1 rounded border">클릭하여 체크하세요</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm border-b border-gray-100">
                                <th class="p-4 font-semibold w-36 min-w-[120px] whitespace-nowrap">일자</th>
                                <th class="p-4 font-semibold min-w-[160px]">감독 교사 1</th>
                                <th class="p-4 font-semibold min-w-[160px]">감독 교사 2</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleTable" class="divide-y divide-gray-100">
                            <!-- JS will populate this -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Right Column: Statistics -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 h-fit">
                <div class="p-5 border-b border-gray-100 bg-blue-50 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-blue-800">📊 월간 식사 통계</h2>
                    <!-- 엑셀 다운로드 버튼 -->
                    <button onclick="downloadExcel()" class="px-3 py-1.5 bg-green-500 text-white rounded-md hover:bg-green-600 transition duration-200 text-xs font-medium shadow-sm flex items-center">
                        <i class="fas fa-file-excel mr-1"></i> 엑셀 저장
                    </button>
                </div>
                <div class="p-0">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-gray-500 text-sm border-b border-gray-100 bg-gray-50">
                                <th class="p-4 font-medium">선생님 성함</th>
                                <th class="p-4 font-medium text-center">식사 횟수</th>
                            </tr>
                        </thead>
                        <tbody id="statsTable" class="divide-y divide-gray-100">
                            <!-- JS will populate this -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 모듈 타입 스크립트로 변경 및 클라우드 동기화 로직 적용 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // HTML의 onclick 등에서 직접 호출할 수 있도록 함수를 전역 객체(window)에 등록
        window.handleFileUpload = handleFileUpload;
        window.resetData = resetData;
        window.downloadExcel = downloadExcel;
        window.toggleDinner = toggleDinner;

        // --- 실시간 연동을 위한 전역 변수 ---
        let rawSchedule = [];
        let dinnerState = {};
        let uniqueTeachers = [];

        // =========================================================================
        // [중요] 깃허브(GitHub) 배포 시 아래 영역에 선생님의 Firebase 설정을 넣어주세요!
        // =========================================================================
        // Firebase 프로젝트를 만드신 후 발급받은 config 코드를 아래 null 대신 붙여넣어주세요.
        // 예시: 
        // const myFirebaseConfig = {
        //     apiKey: "AIzaSyC...",
        //     authDomain: "my-school-app.firebaseapp.com",
        //     projectId: "my-school-app",
        //     storageBucket: "my-school-app.appspot.com",
        //     messagingSenderId: "1234567890",
        //     appId: "1:1234567890:web:abcdef123456"
        // };
        const myFirebaseConfig = {
  apiKey: "AIzaSyAHynq2ZeElY-eyIm3XrhIEAKpjospVBqI",
  authDomain: "teacher-dinner-count-1st.firebaseapp.com",
  projectId: "teacher-dinner-count-1st",
  storageBucket: "teacher-dinner-count-1st.firebasestorage.app",
  messagingSenderId: "418360271187",
  appId: "1:418360271187:web:b3611daab61f32040501a6",
  measurementId: "G-FR01QTLZE5"
}; 
        // =========================================================================

        // 클라우드 접속 정보 (제미나이 환경 우선, 깃허브 등 외부일 경우 선생님의 설정 사용)
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : myFirebaseConfig;
        
        // 데이터베이스 문서 고유 경로용 ID
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'school-dinner-app-public';
        
        let app, auth, db, currentUser;

        // 클라우드 초기화
        if (firebaseConfig) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };
            
            initAuth().catch(console.error);

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    listenToData();
                }
            });
        } else {
            // DB 접속 정보가 없을 경우(깃허브 배포 후 myFirebaseConfig를 넣지 않았을 때) 에러 메시지 표시
            showToast("⚠️ 클라우드 설정이 없습니다. 깃허브 배포 시 Firebase 접속 코드를 넣어주세요. (새로고침 시 초기화됨)");
            renderEmptyState();
        }

        // --- 클라우드에서 실시간으로 데이터 받아오기 ---
        function listenToData() {
            if (!currentUser || !db) return;
            // 모두가 공통으로 바라보는 데이터베이스 문서 경로
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'schoolData', 'main');
            
            onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    rawSchedule = data.rawSchedule || [];
                    dinnerState = data.dinnerState || {};
                    uniqueTeachers = [...new Set(rawSchedule.flatMap(day => day.teachers || []))].sort();
                    
                    if(rawSchedule.length === 0) {
                        renderEmptyState();
                    } else {
                        updateTitle();
                        renderSchedule();
                        updateStats();
                    }
                } else {
                    renderEmptyState();
                }
            }, (error) => {
                console.error("동기화 에러:", error);
                showToast("실시간 데이터를 불러오는 중 오류가 발생했습니다.");
            });
        }

        // --- 변경된 데이터를 클라우드에 영구 저장하기 ---
        async function saveDataToCloud() {
            if (!currentUser || !db) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'schoolData', 'main');
            try {
                await setDoc(docRef, {
                    rawSchedule: rawSchedule,
                    dinnerState: dinnerState
                });
            } catch (error) {
                console.error("Save error: ", error);
                showToast("데이터 클라우드 저장에 실패했습니다.");
            }
        }

        // --- UI 기본 함수들 ---
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 3000);
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr) return "";
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                const month = parts[0].trim().padStart(2, '0');
                const day = parts[1].trim().padStart(2, '0');
                return `${month}월 ${day}일`;
            }
            return dateStr;
        }

        function formatExcelDate(dateStr) {
            if (!dateStr) return "";
            if (dateStr.includes('월')) {
                const month = parseInt(dateStr.split('월')[0].replace(/[^0-9]/g, ''), 10);
                const day = parseInt(dateStr.split('월')[1].replace(/[^0-9]/g, ''), 10);
                return `${month}/${day}`;
            }
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                return `${parseInt(parts[0], 10)}/${parseInt(parts[1], 10)}`;
            }
            return dateStr;
        }

        function renderEmptyState() {
            document.getElementById('checklistTitle').innerHTML = `📅 대기 중`;
            document.getElementById('scheduleTable').innerHTML = `<tr><td colspan="3" class="p-10 text-center text-gray-500 font-medium">현재 클라우드에 등록된 명단이 없습니다.<br>담당자 선생님께서는 우측 상단의 <strong class="text-blue-500">새 명단 업로드</strong> 버튼을 눌러 파일을 올려주세요.</td></tr>`;
            document.getElementById('statsTable').innerHTML = `<tr><td colspan="2" class="p-6 text-center text-gray-400">명단을 업로드하면 통계가 표시됩니다.</td></tr>`;
        }

        function updateTitle() {
            if (rawSchedule.length > 0) {
                const firstDateText = rawSchedule[0].date;
                let monthText = '새로운';
                if (firstDateText.includes('월')) {
                    monthText = firstDateText.split('월')[0] + '월';
                } else if (firstDateText.includes('/')) {
                    monthText = firstDateText.split('/')[0] + '월';
                }
                document.getElementById('checklistTitle').innerHTML = `📅 ${monthText} 체크리스트`;
            }
        }

        function toggleDinner(date, teacher) {
            const key = `${date}_${teacher}`;
            dinnerState[key] = !dinnerState[key];
            
            // 시각적 업데이트 최적화
            const btn = document.getElementById(`btn_${key}`);
            if (dinnerState[key]) {
                btn.classList.remove('bg-gray-100', 'text-gray-400', 'border-gray-200');
                btn.classList.add('bg-blue-500', 'text-white', 'border-blue-600', 'shadow-inner');
                btn.innerHTML = '<i class="fas fa-check mr-1"></i> 식사 완료';
            } else {
                btn.classList.add('bg-gray-100', 'text-gray-400', 'border-gray-200');
                btn.classList.remove('bg-blue-500', 'text-white', 'border-blue-600', 'shadow-inner');
                btn.innerHTML = '<i class="fas fa-utensils mr-1"></i> 미확인';
            }
            
            updateStats();
            
            // DB 접속 상태라면 데이터 전송
            if(firebaseConfig) {
                saveDataToCloud();
            } else {
                showToast("⚠️ DB 설정이 없어 내역이 브라우저에만 임시로 남습니다.");
            }
        }

        function renderSchedule() {
            const tbody = document.getElementById('scheduleTable');
            tbody.innerHTML = '';

            rawSchedule.forEach(day => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-blue-50/50 transition duration-150';
                const displayDate = formatDisplayDate(day.date);
                let rowHTML = `<td class="p-4 text-gray-700 font-bold whitespace-nowrap tracking-wide">${displayDate}</td>`;
                
                const teachersList = day.teachers || [];
                teachersList.forEach((teacher) => {
                    const key = `${day.date}_${teacher}`;
                    const isChecked = dinnerState[key] || false;
                    
                    const btnClass = isChecked 
                        ? 'bg-blue-500 text-white border-blue-600 shadow-inner' 
                        : 'bg-gray-100 text-gray-400 border-gray-200 hover:bg-gray-200';
                    const icon = isChecked ? '<i class="fas fa-check mr-1"></i> 식사 완료' : '<i class="fas fa-utensils mr-1"></i> 미확인';

                    rowHTML += `
                        <td class="p-4">
                            <div class="flex items-center space-x-3 whitespace-nowrap">
                                <div class="w-8 h-8 shrink-0 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-sm">
                                    ${teacher.charAt(0)}
                                </div>
                                <span class="font-medium text-gray-800 shrink-0 w-12">${teacher}</span>
                                <button id="btn_${key}" onclick="toggleDinner('${day.date}', '${teacher}')" 
                                    class="ml-2 w-24 shrink-0 flex justify-center items-center py-1.5 rounded-md border text-xs font-medium transition-all duration-200 ${btnClass}">
                                    ${icon}
                                </button>
                            </div>
                        </td>
                    `;
                });
                
                for(let i = teachersList.length; i < 2; i++) {
                     rowHTML += `<td class="p-4"><span class="text-gray-400 text-sm">-</span></td>`;
                }
                tr.innerHTML = rowHTML;
                tbody.appendChild(tr);
            });
        }

        function updateStats() {
            if (rawSchedule.length === 0) return;
            const stats = {};
            uniqueTeachers.forEach(t => stats[t] = 0);

            for (const key in dinnerState) {
                if (dinnerState[key]) {
                    const teacher = key.split('_')[1];
                    if (stats[teacher] !== undefined) {
                        stats[teacher]++;
                    }
                }
            }

            const tbody = document.getElementById('statsTable');
            tbody.innerHTML = '';
            const sortedTeachers = uniqueTeachers.sort((a, b) => stats[b] - stats[a]);

            sortedTeachers.forEach(teacher => {
                const count = stats[teacher];
                const tr = document.createElement('tr');
                let badgeClass = count > 0 ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-500';
                tr.innerHTML = `
                    <td class="p-4 flex items-center">
                         <div class="w-8 h-8 rounded-full ${count > 0 ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-500'} flex items-center justify-center font-bold text-sm mr-3">
                            ${teacher.charAt(0)}
                        </div>
                        <span class="font-medium ${count > 0 ? 'text-gray-800' : 'text-gray-500'}">${teacher}</span>
                    </td>
                    <td class="p-4 text-center">
                        <span class="px-3 py-1 rounded-full text-sm font-bold ${badgeClass}">
                            ${count}회
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function resetData() {
            if(rawSchedule.length === 0) return;
            dinnerState = {};
            renderSchedule();
            updateStats();
            
            if(firebaseConfig) {
                saveDataToCloud();
                showToast("식사 기록이 모두 초기화되었습니다. 다른 접속자들의 화면도 함께 초기화됩니다.");
            } else {
                showToast("⚠️ 임시 데이터가 초기화되었습니다.");
            }
        }

        // --- 파일 업로드 처리 ---
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileExt = file.name.split('.').pop().toLowerCase();

            if (fileExt === 'pdf') {
                processPDFFile(file);
            } else {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                    
                    processImportedData(json);
                };
                reader.readAsArrayBuffer(file);
            }
            event.target.value = '';
        }

        async function processPDFFile(file) {
            showToast("PDF 문서를 분석 중입니다...");
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const typedarray = new Uint8Array(e.target.result);
                    const pdf = await pdfjsLib.getDocument({data: typedarray}).promise;
                    let fullText = "";
                    for(let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(" ");
                        fullText += pageText + " ";
                    }
                    const potentialNames = fullText.match(/[가-힣]{2,4}/g) || [];
                    const excludeWords = ['일자', '교실', '비고', '진로체험', '중간고사', '자율', '학습', '당번', '안내', '배정고등학교', '학년', '시', '월', '화', '수', '목', '금', '토', '일', '날짜', '감독교사'];
                    const teachers = [...new Set(potentialNames.filter(name => !excludeWords.includes(name) && name.length >= 2 && name.length <= 4))];
                    
                    if(teachers.length > 0) {
                        alert(`[PDF 인식 결과 안내]\n\nPDF 문서에서 아래 선생님들의 성함을 찾았습니다.\n▶ ${teachers.slice(0, 10).join(', ')} 등...\n\n안정적인 통계 대시보드 운영을 위해서는 가급적 '엑셀/CSV 파일'로 명단을 업로드하시는 것을 강력히 권장해 드립니다!`);
                        showToast("자동 매칭을 위해 엑셀/CSV 양식을 권장합니다.");
                    } else {
                        showToast("PDF에서 선생님 명단을 찾지 못했습니다.");
                    }
                } catch (error) {
                    showToast("PDF 파일을 읽는 중 오류가 발생했습니다.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function processImportedData(data) {
            if (!data || data.length < 2) {
                showToast("데이터가 부족하거나 형식이 잘못되었습니다.");
                return;
            }

            let newScheduleMap = new Map();
            for (let i = 0; i < data.length; i++) {
                const row = data[i];
                if (!row || row.length === 0) continue;
                const firstCell = String(row[0]).trim();

                if (firstCell === '날짜') {
                    const dates = row.slice(1);
                    let teacherRows = [];
                    let nextIdx = i + 1;
                    while (nextIdx < data.length) {
                        const nextRow = data[nextIdx];
                        if (!nextRow || nextRow.length === 0) break;
                        const nextFirstCell = String(nextRow[0]).trim();
                        if (nextFirstCell.startsWith('감독교사')) {
                            teacherRows.push(nextRow);
                            nextIdx++;
                        } else {
                            break;
                        }
                    }

                    for (let j = 0; j < dates.length; j++) {
                        const dateVal = dates[j];
                        if (!dateVal || String(dateVal).trim() === '') continue;
                        const dateStr = String(dateVal).trim();
                        let dailyTeachers = [];
                        
                        for (const tRow of teacherRows) {
                            const tName = (tRow[j + 1]) ? String(tRow[j + 1]).trim() : '';
                            if (tName) {
                                dailyTeachers.push(...tName.split(',').map(t => t.trim()).filter(t => t));
                            }
                        }
                        
                        if (dailyTeachers.length > 0) {
                            if (newScheduleMap.has(dateStr)) {
                                newScheduleMap.get(dateStr).push(...dailyTeachers);
                            } else {
                                newScheduleMap.set(dateStr, dailyTeachers);
                            }
                        }
                    }
                }
            }

            let newSchedule = Array.from(newScheduleMap, ([date, teachers]) => ({ date, teachers }));

            if (newSchedule.length > 0) {
                rawSchedule = newSchedule;
                uniqueTeachers = [...new Set(rawSchedule.flatMap(day => day.teachers || []))].sort();
                dinnerState = {}; // 새 명단을 올리면 식사 상태 초기화
                
                updateTitle();
                renderSchedule();
                updateStats();
                
                if(firebaseConfig) {
                    saveDataToCloud();
                    showToast("새 명단이 클라우드에 성공적으로 등록되었습니다. 모든 사람에게 반영됩니다.");
                } else {
                    showToast("⚠️ 임시 명단이 등록되었습니다. (DB 연결 안됨)");
                }
            } else {
                showToast("데이터를 읽지 못했습니다. 맨 앞칸이 '날짜', '감독교사1', '감독교사2'인 양식을 확인해주세요.");
            }
        }

        // --- 엑셀로 월간 통계 다운로드 ---
        function downloadExcel() {
            if (uniqueTeachers.length === 0) {
                showToast("다운로드할 통계 데이터가 없습니다.");
                return;
            }

            let monthPrefix = "";
            if (rawSchedule.length > 0) {
                const firstDate = String(rawSchedule[0].date);
                if (firstDate.includes('/')) {
                    monthPrefix = firstDate.split('/')[0] + "월_";
                } else if (firstDate.includes('월')) {
                    monthPrefix = firstDate.split('월')[0].trim() + "월_";
                }
            }
            const fileName = `${monthPrefix}자율학습_저녁식사_통계`;

            const allDates = rawSchedule.map(day => day.date);
            const excelDates = allDates.map(dateStr => formatExcelDate(dateStr));
            const excelData = [];
            
            const titleRow = new Array(excelDates.length + 2).fill("");
            titleRow[0] = fileName;
            excelData.push(titleRow);

            const headerRow = ["선생님 성함", ...excelDates, "합계"];
            excelData.push(headerRow);

            const stats = {};
            uniqueTeachers.forEach(t => stats[t] = 0);
            for (const key in dinnerState) {
                if (dinnerState[key]) {
                    const teacher = key.split('_')[1];
                    if (stats[teacher] !== undefined) {
                        stats[teacher]++;
                    }
                }
            }

            const sortedTeachers = uniqueTeachers.sort((a, b) => stats[b] - stats[a]);

            sortedTeachers.forEach(teacher => {
                const row = [teacher];
                let total = 0;
                allDates.forEach(date => {
                    const key = `${date}_${teacher}`;
                    if (dinnerState[key]) {
                        row.push("O");
                        total++;
                    } else {
                        row.push("");
                    }
                });
                row.push(total);
                excelData.push(row);
            });

            const ws = XLSX.utils.aoa_to_sheet(excelData);

            ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: headerRow.length - 1 } }];

            const colWidths = [{ wch: 12 }]; 
            excelDates.forEach(() => colWidths.push({ wch: 5 })); 
            colWidths.push({ wch: 8 }); 
            ws['!cols'] = colWidths;

            const rowHeights = [{ hpt: 40 }, { hpt: 25 }]; 
            sortedTeachers.forEach(() => rowHeights.push({ hpt: 22 })); 
            ws['!rows'] = rowHeights;

            ws['!pageSetup'] = { fitToPage: true, fitToWidth: 1, fitToHeight: 1, orientation: 'landscape' };

            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cellRef = XLSX.utils.encode_cell({ r: R, c: C });
                    if (!ws[cellRef]) ws[cellRef] = { t: 's', v: '' };

                    const borderStyle = {
                        top: { style: 'thin', color: { rgb: "000000" } },
                        bottom: { style: 'thin', color: { rgb: "000000" } },
                        left: { style: 'thin', color: { rgb: "000000" } },
                        right: { style: 'thin', color: { rgb: "000000" } }
                    };

                    if (R === 0) {
                        ws[cellRef].s = { font: { sz: 16, bold: true }, alignment: { horizontal: "center", vertical: "center" } };
                    } else if (R === 1) {
                        ws[cellRef].s = { font: { bold: true, color: { rgb: "333333" } }, fill: { fgColor: { rgb: "F3F4F6" } }, alignment: { horizontal: "center", vertical: "center" }, border: borderStyle };
                    } else {
                        ws[cellRef].s = { alignment: { horizontal: "center", vertical: "center" }, border: borderStyle };
                    }
                }
            }

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, fileName.substring(0, 31));
            XLSX.writeFile(wb, `${fileName}.xlsx`);
            showToast("엑셀 파일이 다운로드 되었습니다.");
        }
    </script>
